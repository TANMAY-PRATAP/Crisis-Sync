<!DOCTYPE html>
<html>
<head>
  <title>Report Crisis</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background: #f5f6fa;
      font-family: Arial;
      text-align: center;
    }

    .form-container {
      max-width: 500px;
      margin: auto;
      margin-top: 60px;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h2 {
      margin-bottom: 20px;
    }

    input, textarea {
      width: 90%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      padding: 12px 20px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .submit-btn {
      background: #e74c3c;
      color: white;
    }

    .submit-btn:hover {
      background: #c0392b;
    }

    .location-btn {
      background: #3498db;
      color: white;
    }

    .location-btn:hover {
      background: #2980b9;
    }

    .back-btn {
      display: block;
      margin-top: 15px;
      text-decoration: none;
      color: #333;
    }
  </style>
</head>

<body>

  <div class="form-container">
    <h2>🚨 Report Crisis</h2>

    <input type="text" id="title" placeholder="Type (Fire, Accident...)" required>

    <textarea id="desc" placeholder="Description" rows="4" required></textarea>

    <input type="text" id="location" placeholder="Location (lat,lng OR city)" required>

    <!-- 🔥 AUTO LOCATION BUTTON -->
    <button class="location-btn" onclick="getLocation()">
      📍 Auto Detect Location
    </button>

    <br>

    <button class="submit-btn" onclick="submitReport()">
      Submit Report
    </button>

    <a href="dashboard.html" class="back-btn">⬅ Back to Dashboard</a>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

  <script src="app.js"></script>

</body>
</html>
